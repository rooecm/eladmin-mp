spring:
  application:
    name: rooe-admin
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # 已有数据的库首次启动只打基线标记并跳过 V1，只有空库会真正执行 V1__baseline.sql
    baseline-on-migrate: true
    baseline-version: 1
    # clean 会清空整个 schema，显式关掉以免版本升级或误操作让它重新可用
    clean-disabled: true
  jackson:
    # 与前端约定的日期格式，保持与旧序列化器一致
    date-format: yyyy-MM-dd HH:mm:ss
    # 与数据库连接的 serverTimezone 保持一致
    time-zone: Asia/Shanghai
  profiles: # 激活的环境
    active: dev
logbook:
  obfuscate:
    json-body-fields:
      - password
      - oldPass
      - newPass
      - oldPassword
      - newPassword
      - confirmPassword
      - token
      - accessToken
      - access_token
      - refresh_token
      - secret
  filter:
    enabled: ${WEB_LOG_ENABLED:true}
  secure-filter:
    enabled: ${WEB_LOG_ENABLED:true}
  predicate:
    # 列表覆盖 starter 默认值，因此保留通用排除项并补充本应用路径。
    exclude:
      - path: /actuator/**
      - path: /druid/**
      - path: /swagger-ui/**
      - path: /v3/api-docs/**
      - path: /webjars/**
      - path: /avatar/**
      - path: /webSocket/**
      - path: /doc.html
      - path: /favicon.ico

server:
  port: 8000
  http2:
    # 启用 HTTP/2 支持，提升传输效率
    enabled: true
  compression:
    # 启用 GZIP 压缩，减少传输数据量
    enabled: true
    # 需要压缩的 MIME 类型
    mime-types: text/html, text/xml, text/plain, application/json
    # 最小压缩响应大小（字节）
    min-response-size: 1024

mybatis-plus:
  configuration:
    # 关闭二级缓存
    cache-enabled: false
    # 设置本地缓存作用域
    local-cache-scope: SESSION

#  pid:
#    file: /自行指定位置/rooe-admin.pid

springdoc:
  api-docs:
    enabled: ${swagger.enabled:true}
  swagger-ui:
    enabled: ${swagger.enabled:true}

task:
  pool:
    # 核心线程池大小
    core-pool-size: 10
    # 最大线程数
    max-pool-size: 30
    # 活跃时间
    keep-alive-seconds: 60
    # 队列容量
    queue-capacity: 50

# Opaque sessions. Set explicit deployment origins and a secure password for create/reset operations.
auth:
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:8013,http://127.0.0.1:8013}
  initial-password: ${AUTH_INITIAL_PASSWORD:}
  super-admin-role-code: SUPER_ADMIN
  session:
    access-ttl: 15m
    refresh-ttl: 30d
    replay-marker-ttl: 10m

  cache:
    user-ttl: 60s
    role-permission-ttl: 5m
