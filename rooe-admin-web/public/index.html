<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <% if (process.env.NODE_ENV === 'production') { %>
    <meta content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' <%= process.env.VUE_APP_BASE_API || '' %>; object-src 'none'; base-uri 'self'; form-action 'self'"
          http-equiv="Content-Security-Policy">
    <% } %>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= webpackConfig.name %></title>
  </head>
  <body>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
